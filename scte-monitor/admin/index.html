<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — Clientes SCTE-35</title>
    <style>
        html, body { height: 100%; }
        body {
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
            margin: 0;
            display: flex;
        }
        h1 { color: #ffffff; font-size: 22px; margin-top: 0; }

        /* --- Menu lateral: acesso rápido às interfaces por cliente
           (monitor SCTE-35 e player full-screen), montado a partir da mesma
           lista de clientes já carregada para a tabela abaixo. --- */
        .sidebar {
            width: 260px;
            flex: 0 0 260px;
            background: #1a1a1a;
            border-right: 1px solid #2a2a2a;
            height: 100vh;
            position: sticky;
            top: 0;
            overflow-y: auto;
            padding: 20px 0;
            box-sizing: border-box;
        }
        .sidebar-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: #666;
            padding: 0 20px;
            margin-bottom: 10px;
        }
        .sidebar-empty {
            padding: 0 20px;
            font-size: 13px;
            color: #666;
        }
        .sidebar-client {
            padding: 10px 20px;
            border-bottom: 1px solid #232323;
        }
        .sidebar-client-name {
            font-size: 14px;
            font-weight: bold;
            color: #eee;
            margin-bottom: 6px;
            word-break: break-all;
        }
        .sidebar-links {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .sidebar-links-divider {
            border-top: 1px dashed #2e2e2e;
            margin: 4px 0;
        }
        .sidebar-link {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: #4ee08a;
            text-decoration: none;
            padding: 3px 0;
        }
        .sidebar-link:hover { text-decoration: underline; }
        .sidebar-link .ico { width: 14px; text-align: center; opacity: 0.8; }

        .content {
            flex: 1 1 auto;
            min-width: 0;
            padding: 32px;
            max-width: 900px;
        }
        .panel {
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            padding: 20px;
            margin-bottom: 24px;
        }
        .form-row { display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 8px; }
        label { display: block; font-size: 12px; color: #999; margin-bottom: 4px; }
        input {
            background: #262626; border: 1px solid #333; color: white;
            padding: 8px 10px; border-radius: 4px; font-size: 14px;
        }
        button {
            background: #E50914; color: white; border: none; padding: 9px 18px;
            border-radius: 4px; cursor: pointer; font-size: 14px; font-weight: bold;
        }
        button:hover { background: #ff1a25; }
        button.danger { background: #333; }
        button.danger:hover { background: #444; }
        button.icon-btn {
            background: none; border: none; color: #999; padding: 4px 6px;
            font-size: 15px; cursor: pointer; border-radius: 4px;
        }
        button.icon-btn:hover { background: #333; color: white; }
        .passphrase-cell { display: flex; align-items: center; gap: 6px; font-family: monospace; }
        .passphrase-value { min-width: 90px; }
        .passphrase-value.hidden-value::selection { background: transparent; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 12px; }
        th { text-align: left; padding: 8px 10px; color: #999; border-bottom: 1px solid #333; font-weight: normal; }
        td { padding: 8px 10px; border-bottom: 1px solid #2a2a2a; }
        code { background: #262626; padding: 2px 6px; border-radius: 3px; font-size: 12px; }
        .msg { padding: 10px; border-radius: 4px; margin-bottom: 12px; font-size: 13px; display: none; }
        .msg.error { background: #e74c3c33; color: #ff6b5e; display: block; }
        .msg.success { background: #2ecc7133; color: #4ee08a; display: block; }
        .hint { font-size: 12px; color: #777; margin-top: 4px; }
        .credentials-box { background: #0f2f1f; border: 1px solid #2ecc71; border-radius: 4px; padding: 12px; margin-top: 12px; font-size: 13px; }
    </style>
</head>
<body>
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-title">Interfaces por cliente</div>
        <div id="sidebarBody"><div class="sidebar-empty">Carregando...</div></div>
    </nav>

    <div class="content">
    <h1>Admin — Clientes SCTE-35</h1>

    <div class="panel">
        <div id="msg" class="msg"></div>
        <div class="form-row">
            <div>
                <label for="username">Usuário</label>
                <input id="username" placeholder="ex: videomart" autocomplete="off">
            </div>
            <div>
                <label for="passphrase">Senha SRT (opcional, gera automática se vazio)</label>
                <input id="passphrase" placeholder="mín. 10 caracteres" autocomplete="off">
            </div>
            <button onclick="createClient()">Cadastrar cliente</button>
        </div>
        <div class="hint">
            Usuário vira a URL pública (streaming.tvtupi.com.br/&lt;usuario&gt;) e recebe uma
            porta SRT dedicada para transmissão. A senha é a passphrase SRT que o encoder usa.
        </div>
        <div id="newClientBox"></div>
    </div>

    <div class="panel">
        <table>
            <thead>
                <tr><th>Usuário</th><th>Senha SRT</th><th>Porta SRT</th><th>Criado em</th><th>URL pública</th><th></th></tr>
            </thead>
            <tbody id="clientsBody">
                <tr><td colspan="6">Carregando...</td></tr>
            </tbody>
        </table>
    </div>
    </div>

    <script>
        var msgEl = document.getElementById('msg');
        var newClientBox = document.getElementById('newClientBox');
        var clientsBody = document.getElementById('clientsBody');
        var sidebarBody = document.getElementById('sidebarBody');

        function showMsg(text, type) {
            msgEl.className = 'msg ' + type;
            msgEl.textContent = text;
        }

        function fmtDate(iso) {
            return new Date(iso).toLocaleString('pt-BR');
        }

        function maskPassphrase(pass) {
            return '•'.repeat(Math.min(pass.length, 12));
        }

        // Domínio do outro pipeline (nginx-rtmp, ingest RTMP legado, serviço
        // separado do scte-monitor/SRT) -- mesmo host desta página, trocando
        // só o subdomínio "streaming" por "rtmp" (streaming.tvtupi.com.br ->
        // rtmp.tvtupi.com.br). Funciona em produção; em dev local sem esse
        // padrão de subdomínio, o link fica com o host errado (aceitável,
        // não há RTMP local dedicado por cliente hoje).
        function rtmpOrigin() {
            var host = window.location.hostname.replace(/^streaming\./, 'rtmp.');
            return window.location.protocol + '//' + host;
        }

        function renderSidebar(list) {
            if (list.length === 0) {
                sidebarBody.innerHTML = '<div class="sidebar-empty">Nenhum cliente cadastrado ainda.</div>';
                return;
            }
            var origin = window.location.origin;
            var rtmpBase = rtmpOrigin();
            sidebarBody.innerHTML = list.map(function (c) {
                var monitorUrl = origin + '/' + c.username;
                var playerUrl = origin + '/player/' + c.username;
                var hlsFileUrl = origin + '/hls-live/' + c.username + '/index.m3u8';
                var rtmpHlsUrl = rtmpBase + '/hls/' + c.username + '.m3u8';
                var rtmpPlayerUrl = rtmpBase + '/rtmp-player/' + c.username;
                return '<div class="sidebar-client">' +
                    '<div class="sidebar-client-name">' + c.username + '</div>' +
                    '<div class="sidebar-links">' +
                    '<a class="sidebar-link" href="' + monitorUrl + '" target="_blank">' +
                    '<span class="ico">📊</span>Monitor SCTE-35</a>' +
                    '<a class="sidebar-link" href="' + playerUrl + '" target="_blank">' +
                    '<span class="ico">▶</span>Player</a>' +
                    '<a class="sidebar-link" href="' + hlsFileUrl + '" target="_blank">' +
                    '<span class="ico">📄</span>Arquivo HLS (.m3u8)</a>' +
                    '<div class="sidebar-links-divider"></div>' +
                    '<a class="sidebar-link" href="' + rtmpHlsUrl + '" target="_blank">' +
                    '<span class="ico">📄</span>Streaming RTMP (.m3u8)</a>' +
                    '<a class="sidebar-link" href="' + rtmpPlayerUrl + '" target="_blank">' +
                    '<span class="ico">▶</span>Player RTMP</a>' +
                    '</div></div>';
            }).join('');
        }

        function loadClients() {
            fetch('/admin/api/clients')
                .then(function (r) { return r.json(); })
                .then(function (list) {
                    renderSidebar(list);
                    if (list.length === 0) {
                        clientsBody.innerHTML = '<tr><td colspan="6">Nenhum cliente cadastrado ainda.</td></tr>';
                        return;
                    }
                    clientsBody.innerHTML = '';
                    list.forEach(function (c) {
                        var tr = document.createElement('tr');
                        var url = window.location.origin + '/' + c.username;
                        tr.innerHTML =
                            '<td>' + c.username + '</td>' +
                            '<td><div class="passphrase-cell">' +
                            '<span class="passphrase-value" data-pass="' + c.passphrase + '" data-visible="false">' +
                            maskPassphrase(c.passphrase) + '</span>' +
                            '<button class="icon-btn toggle-pass" data-user="' + c.username + '" title="Mostrar/ocultar senha">👁</button>' +
                            '</div></td>' +
                            '<td>' + (c.srtPort || '—') + '</td>' +
                            '<td>' + fmtDate(c.createdAt) + '</td>' +
                            '<td><a href="' + url + '" target="_blank" style="color:#4ee08a">' + url + '</a></td>' +
                            '<td>' +
                            '<button class="icon-btn edit-pass" data-user="' + c.username + '" title="Editar senha">✎</button>' +
                            '<button class="danger" data-user="' + c.username + '">Remover</button>' +
                            '</td>';
                        clientsBody.appendChild(tr);
                    });
                    Array.prototype.forEach.call(clientsBody.querySelectorAll('button.danger'), function (btn) {
                        btn.addEventListener('click', function () { removeClient(btn.dataset.user); });
                    });
                    Array.prototype.forEach.call(clientsBody.querySelectorAll('button.toggle-pass'), function (btn) {
                        btn.addEventListener('click', function () { togglePassphrase(btn); });
                    });
                    Array.prototype.forEach.call(clientsBody.querySelectorAll('button.edit-pass'), function (btn) {
                        btn.addEventListener('click', function () { editPassphrase(btn.dataset.user); });
                    });
                });
        }

        function togglePassphrase(btn) {
            var span = btn.previousElementSibling;
            var visible = span.dataset.visible === 'true';
            span.textContent = visible ? maskPassphrase(span.dataset.pass) : span.dataset.pass;
            span.dataset.visible = visible ? 'false' : 'true';
        }

        function editPassphrase(username) {
            var newPass = prompt('Nova senha SRT para "' + username + '" (mín. 10 caracteres, deixe vazio para gerar automaticamente):');
            if (newPass === null) return; // cancelado
            newPass = newPass.trim();
            fetch('/admin/api/clients/' + encodeURIComponent(username), {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ passphrase: newPass || undefined })
            })
                .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
                .then(function (res) {
                    if (!res.ok) {
                        showMsg(res.data.error || 'Erro ao atualizar senha.', 'error');
                        return;
                    }
                    showMsg('Senha de "' + username + '" atualizada. Lembre de reconfigurar o encoder com a nova senha.', 'success');
                    loadClients();
                })
                .catch(function () { showMsg('Erro de rede ao atualizar senha.', 'error'); });
        }

        function createClient() {
            var username = document.getElementById('username').value.trim();
            var passphrase = document.getElementById('passphrase').value.trim();
            newClientBox.innerHTML = '';
            fetch('/admin/api/clients', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: username, passphrase: passphrase || undefined })
            })
                .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
                .then(function (res) {
                    if (!res.ok) {
                        showMsg(res.data.error || 'Erro ao cadastrar cliente.', 'error');
                        return;
                    }
                    showMsg('Cliente "' + res.data.username + '" cadastrado com sucesso.', 'success');
                    document.getElementById('username').value = '';
                    document.getElementById('passphrase').value = '';
                    var url = window.location.origin + '/' + res.data.username;
                    newClientBox.innerHTML =
                        '<div class="credentials-box">' +
                        '<strong>Credenciais de transmissão (anote agora, a senha não será mostrada de novo):</strong><br>' +
                        'SRT: <code>srt://' + window.location.hostname + ':' + res.data.srtPort +
                        '?passphrase=' + res.data.passphrase + '</code><br>' +
                        'Visualização pública: <code>' + url + '</code>' +
                        '</div>';
                    loadClients();
                })
                .catch(function () { showMsg('Erro de rede ao cadastrar cliente.', 'error'); });
        }

        function removeClient(username) {
            if (!confirm('Remover o cliente "' + username + '"? Isso encerra a transmissão dele.')) return;
            fetch('/admin/api/clients/' + encodeURIComponent(username), { method: 'DELETE' })
                .then(function () { loadClients(); });
        }

        loadClients();
    </script>
</body>
</html>
