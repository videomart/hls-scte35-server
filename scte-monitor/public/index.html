<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transmissão SRT + Monitor SCTE-35</title>

    <link href="https://vjs.zencdn.net/8.12.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.12.0/video.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #141414;
            color: white;
            margin: 0;
            padding: 24px;
            display: flex;
            flex-wrap: wrap;
            gap: 24px;
            justify-content: center;
            align-items: flex-start;
        }
        h1 {
            width: 100%;
            text-align: center;
            font-size: 22px;
            color: #E50914;
            margin: 0 0 8px 0;
        }
        .video-container {
            width: 100%;
            max-width: 1440px;
            aspect-ratio: 16 / 9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            border-radius: 8px;
            overflow: hidden;
            flex: 2 1 960px;
        }
        .video-js { width: 100% !important; height: 100% !important; }

        .cue-panel {
            flex: 1 1 320px;
            max-width: 420px;
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            max-height: 480px;
        }

        .last-cue {
            width: 100%;
            max-width: 420px;
            background: #1e1e1e;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
            padding: 16px;
            border: 1px solid #333;
        }
        .last-cue-label {
            font-size: 12px; color: #999; text-transform: uppercase;
            letter-spacing: 0.05em; margin-bottom: 8px;
        }
        .last-cue-body {
            display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;
        }
        .last-cue .badge { font-size: 16px; padding: 4px 12px; }
        .last-cue-time { font-size: 14px; color: #ccc; }
        .last-cue-meta { font-size: 12px; color: #777; width: 100%; margin-top: 4px; }
        .last-cue.empty .last-cue-body { color: #666; font-size: 14px; }
        .cue-panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .cue-panel-header h2 { font-size: 16px; margin: 0; color: #ccc; }
        .status-dot {
            width: 10px; height: 10px; border-radius: 50%;
            background: #555; display: inline-block; margin-right: 6px;
        }
        .status-dot.live { background: #2ecc71; box-shadow: 0 0 6px #2ecc71; }
        .status-dot.down { background: #e74c3c; }

        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        thead th {
            position: sticky; top: 0; background: #262626;
            text-align: left; padding: 8px 10px; color: #999;
            font-weight: normal; border-bottom: 1px solid #333;
        }
        tbody { display: block; overflow-y: auto; max-height: 420px; }
        thead, tbody tr { display: table; width: 100%; table-layout: fixed; }
        tbody td { padding: 8px 10px; border-bottom: 1px solid #2a2a2a; }
        tr.new-row { animation: flash 1.2s ease-out; }
        @keyframes flash {
            0% { background-color: rgba(46, 204, 113, 0.35); }
            100% { background-color: transparent; }
        }
        .badge {
            padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;
        }
        .badge.out { background: #e74c3c33; color: #ff6b5e; }
        .badge.in  { background: #2ecc7133; color: #4ee08a; }
        .empty-row td { color: #666; text-align: center; padding: 24px; }

        footer {
            width: 100%;
            text-align: center;
            padding: 20px 12px 4px;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #262626;
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <h1>TRANSMISSÃO SRT — MONITOR SCTE-35</h1>

    <div class="video-container">
        <video
            id="meu-player"
            class="video-js vjs-default-skin vjs-big-play-centered"
            controls
            preload="auto"
            muted
            autoplay>
            <p class="vjs-no-js">Ative o JavaScript para assistir.</p>
        </video>
    </div>

    <div style="flex: 1 1 320px; max-width: 420px; display: flex; flex-direction: column; gap: 16px;">
        <div class="last-cue empty" id="lastCue">
            <div class="last-cue-label">Último cue recebido</div>
            <div class="last-cue-body" id="lastCueBody">Aguardando cues...</div>
        </div>

        <div class="cue-panel">
            <div class="cue-panel-header">
                <h2><span id="statusDot" class="status-dot"></span>Cues recebidos</h2>
                <span id="cueCount" style="color:#777; font-size:12px;">0</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th style="width:32%">Horário</th>
                        <th style="width:18%">Tipo</th>
                        <th style="width:20%">Event ID</th>
                        <th style="width:30%">Progresso</th>
                    </tr>
                </thead>
                <tbody id="cueTableBody">
                    <tr class="empty-row"><td colspan="4">Aguardando cues...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <footer>
        Este é um sistema de testes para monitoração de SCTE-35, exclusivo e dedicado aos clientes Videomart TVPLAY.
    </footer>

    <script>
        var streamPath = new URLSearchParams(window.location.search).get('stream') || 'teste';
        // Proxiado pela mesma origem/porta da página (server.js /hls-live/*),
        // em vez de apontar direto pro MediaMTX (porta interna, HTTP puro) --
        // evita mixed content numa página HTTPS e não exige expor essa porta.
        var streamUrl = '/hls-live/' + streamPath + '/index.m3u8';

        var player = videojs('meu-player', {
            autoplay: true,
            muted: true,
            controls: true,
            fluid: true
        });
        player.src({ src: streamUrl, type: 'application/x-mpegURL' });

        var tbody = document.getElementById('cueTableBody');
        var cueCountEl = document.getElementById('cueCount');
        var statusDot = document.getElementById('statusDot');
        var lastCueEl = document.getElementById('lastCue');
        var lastCueBodyEl = document.getElementById('lastCueBody');
        var count = 0;

        function fmtTime(iso) {
            var d = new Date(iso);
            return d.toLocaleTimeString('pt-BR', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
        }

        function rowHtml(evt) {
            var typeLabel = evt.type === 'out' ? 'CUE-OUT' : 'CUE-IN';
            var badgeClass = evt.type === 'out' ? 'out' : 'in';
            return '<td>' + fmtTime(evt.receivedAt) + '</td>' +
                '<td><span class="badge ' + badgeClass + '">' + typeLabel + '</span></td>' +
                '<td>' + evt.eventId + '</td>' +
                '<td>' + (evt.progress || '') + '</td>';
        }

        function updateLastCue(evt) {
            var typeLabel = evt.type === 'out' ? 'CUE-OUT' : 'CUE-IN';
            var badgeClass = evt.type === 'out' ? 'out' : 'in';
            lastCueEl.classList.remove('empty');
            lastCueBodyEl.innerHTML =
                '<span class="badge ' + badgeClass + '">' + typeLabel + '</span>' +
                '<span class="last-cue-time">' + fmtTime(evt.receivedAt) + '</span>' +
                '<span class="last-cue-meta">Event ID ' + evt.eventId +
                (evt.progress ? ' · ' + evt.progress : '') + '</span>';
        }

        // Renderiza o histórico inicial de uma vez (DocumentFragment) em vez de
        // uma inserção por linha -- evita reflow repetido quando o histórico
        // tem muitos itens.
        function renderHistory(history) {
            tbody.innerHTML = '';
            count = 0;
            if (!history || history.length === 0) {
                tbody.innerHTML = '<tr class="empty-row"><td colspan="4">Aguardando cues...</td></tr>';
                cueCountEl.textContent = '0';
                return;
            }
            var fragment = document.createDocumentFragment();
            history.forEach(function (evt) {
                var tr = document.createElement('tr');
                tr.innerHTML = rowHtml(evt);
                fragment.appendChild(tr);
                count++;
            });
            tbody.appendChild(fragment);
            cueCountEl.textContent = String(count);
            updateLastCue(history[0]);
        }

        function addRow(evt) {
            if (tbody.querySelector('.empty-row')) tbody.innerHTML = '';
            var tr = document.createElement('tr');
            tr.className = 'new-row';
            tr.innerHTML = rowHtml(evt);
            tbody.insertBefore(tr, tbody.firstChild);
            count++;
            cueCountEl.textContent = String(count);
            updateLastCue(evt);
        }

        function connect() {
            var es = new EventSource('/events');
            es.onopen = function () {
                statusDot.className = 'status-dot live';
            };
            es.onerror = function () {
                statusDot.className = 'status-dot down';
            };
            es.onmessage = function (e) {
                var data = JSON.parse(e.data);
                if (data.type === 'hello') {
                    renderHistory(data.history);
                    return;
                }
                addRow(data);
            };
        }
        connect();
    </script>
</body>
</html>
