###############################################
# MediaMTX config — HLS de saída multi-cliente.
#
# O ingest SRT real do TVPlay não vem mais direto pra cá (porta 8890): o
# MediaMTX descarta silenciosamente qualquer track de codec desconhecido já
# na recepção SRT ("skipping track N (unsupported codec)"), o que incluiria
# o PID de SCTE-35. O TVPlay conecta no scte-monitor (porta dedicada por
# cliente, 8900-8930), que faz relay bruto pra cá -- só depois desse relay é
# que o SCTE-35 (já extraído pelo detector) deixa de importar, e o MediaMTX
# só precisa mesmo dar conta de vídeo/áudio pro HLS.
#
# Cada cliente é um path nomeado (username), provisionado dinamicamente
# via Control API pelo scte-monitor (ver clients.js/mediamtx-api.js) --
# não listado aqui manualmente. Cada path tem sua própria
# srtPublishPassphrase/srtReadPassphrase, definida no cadastro do cliente.

# --- Control API: permite o scte-monitor criar/remover paths em runtime,
# sem reiniciar o MediaMTX (POST/DELETE /v3/config/paths/*). ---
api: yes
apiAddress: :9997

# Auth por usuário/senha para a API (o default do MediaMTX só libera a API
# sem senha para IPs 127.0.0.1/::1 -- o scte-monitor chama via rede Docker,
# IP diferente, então precisa de credenciais). MediaMTX não suporta ${VAR}
# no yml -- a senha real é injetada via env var MTX_AUTHINTERNALUSERS_0_PASS
# no docker-compose (sobrescreve este campo em runtime).
authInternalUsers:
  - user: scte-monitor
    pass: changeme
    ips: []
    permissions:
      - action: api
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: api
      - action: metrics
      - action: pprof
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
        path:
      - action: read
        path:
      - action: playback
        path:

# --- SRT (recebe o relay do scte-monitor, não mais o TVPlay direto) ---
srt: yes
srtAddress: :8890

# --- HLS (saída, um path por cliente: streaming.tvtupi.com.br/<usuario>) ---
hls: yes
hlsAddress: :8888
hlsVariant: mpegts
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsAllowOrigins: ["*"]

# --- Desliga o que não estamos usando ---
rtsp: no
rtmp: no
webrtc: no

paths:
  all_others:
