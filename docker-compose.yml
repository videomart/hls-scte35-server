version: '3.8'

services:
  rtmp-server:
    build: .
    image: rtmp-hls:latest
    container_name: rtmp_hls_server
    ports:
      - "1935:1935" # Porta de transmissão RTMP
      - "8085:8085" # Porta de visualização HTTP (HLS) -- acesso direto/local
    environment:
      # HTTPS automático via nginx-proxy + acme-companion (Let's Encrypt),
      # já em uso por outros serviços neste servidor. Sem efeito em ambientes
      # sem essa infraestrutura (ex: dev local) -- só habilita o roteamento
      # se o proxy externo existir e estiver escutando essas env vars.
      VIRTUAL_HOST: "rtmp.tvtupi.com.br"
      VIRTUAL_PORT: "8085"
      LETSENCRYPT_HOST: "rtmp.tvtupi.com.br"
      LETSENCRYPT_EMAIL: "bolais@videomart.com.br"
    networks:
      - default
      - proxy
    volumes:
      - ./hls:/tmp/hls
    restart: always

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx_srt_server
    ports:
      - "8888:8888" # HLS de saída (player/validação)
      # Porta 8891 (SRT) não é exposta ao host: só o scte-monitor,
      # na rede interna do compose, retransmite pra cá.
    volumes:
      - ./mediamtx.yml:/mediamtx.yml
    restart: always

  scte-monitor:
    build: ./scte-monitor
    container_name: scte_monitor
    depends_on:
      - mediamtx
    environment:
      SRT_LISTEN: "0.0.0.0:8890"
      SRT_PASSPHRASE: "${SCTE_SRT_PASSPHRASE}"
      FORWARD_SRT_CALLER: "mediamtx:8891"
      FORWARD_STREAMID: "publish:videomart"
      BASIC_AUTH_USER: "${SCTE_WEB_USER}"
      BASIC_AUTH_PASS: "${SCTE_WEB_PASS}"
      # HTTPS automático via nginx-proxy + acme-companion -- ver comentário
      # equivalente no serviço rtmp-server.
      VIRTUAL_HOST: "streaming.tvtupi.com.br"
      VIRTUAL_PORT: "8095"
      LETSENCRYPT_HOST: "streaming.tvtupi.com.br"
      LETSENCRYPT_EMAIL: "bolais@videomart.com.br"
    networks:
      - default
      - proxy
    ports:
      - "8890:8890/udp" # Ingest SRT (TVPlay -> aqui)
      - "8095:8095"     # Página do monitor (player + tabela de cues) -- acesso direto/local
    volumes:
      - ./scte-monitor/logs:/app/logs
    restart: always

networks:
  default: {}
  proxy:
    # Rede externa do nginx-proxy (jwilder/nginx-proxy + acme-companion),
    # compartilhada com outros serviços deste servidor. Precisa existir
    # previamente (docker network ls); em ambientes sem essa infra, remova
    # este bloco e a referência a "proxy" acima.
    external: true
    name: "${PROXY_NETWORK:-tvplay-web_default}"
